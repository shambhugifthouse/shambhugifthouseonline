<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Shambhu Gift House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .reset-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
        }
    </style>
</head>
<body>

<div class="reset-card text-center">
    <div class="mb-4">
        <div class="bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center rounded-circle p-3 mb-2" style="width: 70px; height: 70px;">
            <i class="fa-solid fa-key fs-2"></i>
        </div>
        <h3 class="fw-bold text-dark font-heading">Reset Password</h3>
        <p class="text-muted small">Enter your username or email address below and we'll send you a link to reset your password.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show text-start small mb-3" role="alert">
                {{ message|urlize|safe }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'auth:forgot_password' %}">
        {% csrf_token %}
        <div class="mb-4 text-start">
            <label class="form-label fw-bold small text-secondary">Username or Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
                <input type="text" name="email_or_username" class="form-control bg-light border-start-0 py-2.5 fw-bold" placeholder="e.g. admin or admin@shambhugifthouse.store" required autofocus>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm mb-3">
            <i class="fa-solid fa-paper-plane me-1.5"></i> Send Reset Link to Email
        </button>

        <a href="{% url 'auth:login' %}" class="text-decoration-none small text-muted fw-bold d-inline-flex align-items-center gap-1">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
